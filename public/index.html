<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTMX + Hono + CF Workers</title>
  <script src="/htmx.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold mb-8 text-center">
      HTMX + Hono + Cloudflare Workers!
    </h1>
    
    <div class="max-w-md mx-auto bg-gray-800 rounded-lg p-6 shadow-lg">
      <h2 class="text-2xl font-semibold mb-4">KV Store Demo</h2>
      
      <form hx-post="/kv" hx-swap="innerHTML" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Key</label>
          <input type="text" name="key" required 
            class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Value</label>
          <input type="text" name="value" required 
            class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 focus:outline-none">
        </div>
        <button type="submit" 
          class="w-full bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-medium transition">
          Save to KV
        </button>
      </form>
      
      <div id="result" class="mt-4 p-3 bg-gray-700 rounded hidden"></div>
      
      <button hx-get="/kv" hx-swap="innerHTML" hx-target="#kv-list"
        class="mt-6 w-full bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-medium transition">
        Load All Keys
      </button>
      
      <div id="kv-list" class="mt-4 space-y-2"></div>
    </div>
    
    <div class="mt-8 text-center">
      <button hx-get="/time" hx-swap="innerHTML" hx-target="#time-display"
        class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium transition">
        Get Server Time
      </button>
      <div id="time-display" class="mt-4 text-xl"></div>
    </div>
  </div>
</body>
</html>
